<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⚡ Bài tập tổng hợp | Present Perfect & Past Simple + Viết lại câu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --primary: #2c3e50;
            --secondary: #2980b9;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', system-ui, 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Thanh điều hướng */
        .master-nav {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .nav-home {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 8px 22px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-home:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .nav-theory {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            padding: 8px 26px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .nav-theory:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #e67e22, #d35400);
        }

        .header-title {
            text-align: center;
            padding: 1.8rem 1rem 0.5rem;
        }

        .header-title h1 {
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 1300px;
            margin: 1.5rem auto;
            padding: 0 1.2rem;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--secondary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Quiz card style */
        .quiz-panel {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }

        .section-badge {
            background: #eef2ff;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .question {
            background: #fafcff;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid #eef2ff;
            transition: all 0.2s;
        }

        .question-text {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
        }

        .opt-label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .opt-label:hover {
            background: #e2e8f0;
        }

        .opt-label input {
            margin: 0;
            width: 18px;
            height: 18px;
            accent-color: var(--secondary);
        }

        .correct {
            background: #d4edda !important;
            border-color: var(--success) !important;
        }

        .incorrect {
            background: #f8d7da !important;
            border-color: var(--danger) !important;
        }

        .explanation {
            margin-top: 12px;
            padding: 10px 14px;
            background: #fff3e0;
            border-left: 4px solid var(--warning);
            border-radius: 16px;
            font-size: 0.85rem;
            display: none;
        }

        .submit-group {
            display: flex;
            justify-content: center;
            margin: 2rem 0 1rem;
        }

        .submit-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            padding: 14px 38px;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .submit-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #27ae60, #1e8449);
        }

        .result-score {
            text-align: center;
            font-size: 1.2rem;
            background: #eef2ff;
            padding: 12px;
            border-radius: 60px;
            margin-top: 20px;
            display: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            padding: 1.8rem;
            font-size: 0.85rem;
        }

        @media (max-width: 650px) {
            .master-nav {
                padding: 0.8rem 1rem;
            }
            .quiz-panel {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="master-nav">
    <a href="../index.html" class="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 9l10 6 10-6-10-6zm0 11.5L6.5 12 12 8.5 17.5 12 12 14.5zM12 21l-6-3.5v-4l6 3.5 6-3.5v4l-6 3.5z"/></svg>
        🏠 Về trang chủ
    </a>
    <div class="header-title" style="padding:0;">
        <h1 style="font-size:1.3rem; margin:0;">📚 60 câu luyện tập: HTHT & QKĐ + Viết lại câu</h1>
    </div>
    <a href="./5. present perfect and past simple.html" class="nav-theory">
        📖 Xem lý thuyết
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">📝 1. Phân biệt thì (30 câu)</button>
        <button class="tab-btn" onclick="switchTab('tab2')">✍️ 2: Viết lại câu (30 câu)</button>
    </div>

    <!-- TAB 1: 30 câu phân biệt thì (Hiện tại đơn, HTHT, QKĐ) -->
    <div id="tab1" class="tab-content active">
        <div class="quiz-panel">
            <div class="section-badge">🎯 Thì hiện tại đơn / hiện tại hoàn thành / quá khứ đơn</div>
            <form id="formTab1">
                <!-- 30 câu được tạo động bằng JS để dễ bảo trì, nhưng sẽ hiển thị đầy đủ -->
            </form>
            <div class="submit-group">
                <button type="button" class="submit-btn" onclick="checkTab1()">✅ Nộp bài & Xem đáp án</button>
            </div>
            <div id="resultTab1" class="result-score"></div>
        </div>
    </div>

    <!-- TAB 2: 30 câu viết lại câu giữa HTHT và QKĐ -->
    <div id="tab2" class="tab-content">
        <div class="quiz-panel">
            <div class="section-badge">🔄 Viết lại câu: Hiện tại hoàn thành ⇔ Quá khứ đơn (cuối câu phải có dấu chấm câu)</div>
            <form id="formTab2">
                <!-- 30 câu rewrite -->
            </form>
            <div class="submit-group">
                <button type="button" class="submit-btn" onclick="checkTab2()">📌 Nộp bài & Xem kết quả</button>
            </div>
            <div id="resultTab2" class="result-score"></div>
        </div>
    </div>
</div>

<footer>💡 Mẹo: Không có mẹo gì đâu, học thật kĩ ngữ pháp trước khi làm bài nhé!</footer>

<script>
    // ---------- DATA CÂU TAB1 (30 câu: đa dạng khẳng định, phủ định, nghi vấn) ----------
    const questionsTab1 = [
        { text: "1. She _______ (work) as a teacher since 2018.", options: ["works", "has worked", "worked"], correct: "has worked", explain: "since 2018 → Hành động kéo dài đến hiện tại → HTHT."},
        { text: "2. I _______ (not / see) that movie yet.", options: ["didn't see", "haven't seen", "don't see"], correct: "haven't seen", explain: "yet → dấu hiệu hiện tại hoàn thành phủ định."},
        { text: "3. They _______ (visit) Paris last summer.", options: ["have visited", "visited", "visit"], correct: "visited", explain: "last summer → thời gian xác định trong quá khứ."},
        { text: "4. _______ you ever _______ (be) to Japan?", options: ["Did / be", "Have / been", "Were / been"], correct: "Have / been", explain: "ever → trải nghiệm → HTHT."},
        { text: "5. My father _______ (not / drink) coffee yesterday morning.", options: ["didn't drink", "hasn't drunk", "doesn't drink"], correct: "didn't drink", explain: "yesterday morning → quá khứ đơn phủ định."},
        { text: "6. Water _______ (boil) at 100 degrees Celsius.", options: ["boils", "has boiled", "boiled"], correct: "boils", explain: "sự thật hiển nhiên → hiện tại đơn."},
        { text: "7. We _______ (already / finish) our homework.", options: ["already finished", "have already finished", "did already finish"], correct: "have already finished", explain: "already → HTHT."},
        { text: "8. He _______ (live) in London for two years, but now he lives in Manchester.", options: ["has lived", "lived", "has been living"], correct: "lived", explain: "hành động đã kết thúc trong quá khứ (now he lives in Manchester) → QKĐ."},
        { text: "9. _______ she _______ (call) you yesterday?", options: ["Did / call", "Has / called", "Does / call"], correct: "Did / call", explain: "yesterday → câu hỏi QKĐ."},
        { text: "10. He _______ (break) his leg, so he can't walk now.", options: ["broke", "has broken", "breaks"], correct: "has broken", explain: "kết quả ảnh hưởng hiện tại → HTHT."},
        { text: "11. Tom _______ (play) football every Sunday.", options: ["plays", "has played", "played"], correct: "plays", explain: "every Sunday → thói quen hiện tại đơn."},
        { text: "12. I _______ (not / eat) anything since breakfast.", options: ["didn't eat", "haven't eaten", "don't eat"], correct: "haven't eaten", explain: "since breakfast → HTHT phủ định."},
        { text: "13. When _______ you _______ (buy) this car?", options: ["have / bought", "did / buy", "do / buy"], correct: "did / buy", explain: "when + thời điểm xác định → QKĐ."},
        { text: "14. The class _______ (already / start) when I arrived.", options: ["already started", "has already started", "had started"], correct: "has already started", explain: "already → HTHT."},
        { text: "15. They _______ (build) this bridge in 1999.", options: ["have built", "built", "build"], correct: "built", explain: "in 1999 → quá khứ xác định."},
        { text: "16. How long _______ you _______ (know) your best friend?", options: ["have / known", "did / know", "do / know"], correct: "have / known", explain: "How long + HTHT chỉ khoảng thời gian đến hiện tại."},
        { text: "17. My sister _______ (not / like) spicy food when she was young.", options: ["hasn't liked", "didn't like", "doesn't like"], correct: "didn't like", explain: "when she was young → QKĐ."},
        { text: "18. The train _______ (just / leave). We have to wait.", options: ["just left", "has just left", "was just leaving"], correct: "has just left", explain: "just → HTHT, ảnh hưởng hiện tại."},
        { text: "19. She often _______ (read) books before bedtime.", options: ["reads", "has read", "read"], correct: "reads", explain: "often → hiện tại đơn thói quen."},
        { text: "20. _______ you _______ (finish) your report yet?", options: ["Did / finish", "Have / finished", "Do / finish"], correct: "Have / finished", explain: "yet → câu hỏi HTHT."},
        { text: "21. I _______ (never / be) to a safari park.", options: ["never went", "have never been", "never go"], correct: "have never been", explain: "never → trải nghiệm, HTHT."},
        { text: "22. He _______ (phone) me three times last week.", options: ["has phoned", "phoned", "phones"], correct: "phoned", explain: "last week → QKĐ."},
        { text: "23. Where _______ you _______ (go) last night?", options: ["have / gone", "did / go", "do / go"], correct: "did / go", explain: "last night → QKĐ."},
        { text: "24. She _______ (not / see) him since they graduated.", options: ["didn't see", "hasn't seen", "doesn't see"], correct: "hasn't seen", explain: "since they graduated → HTHT."},
        { text: "25. They _______ (live) in this town for their whole life.", options: ["have lived", "lived", "live"], correct: "have lived", explain: "for their whole life → tiếp diễn đến nay."},
        { text: "26. I _______ (lose) my keys! I can't find them anywhere.", options: ["lost", "have lost", "lose"], correct: "have lost", explain: "kết quả ở hiện tại → HTHT."},
        { text: "27. We _______ (have) a great time at the party yesterday.", options: ["have had", "had", "have"], correct: "had", explain: "yesterday → QKĐ."},
        { text: "28. The baby _______ (sleep) for ten hours every night.", options: ["sleeps", "has slept", "slept"], correct: "sleeps", explain: "every night → hiện tại đơn."},
        { text: "29. _______ you ever _______ (try) Vietnamese Pho?", options: ["Did / try", "Have / tried", "Do / try"], correct: "Have / tried", explain: "ever → HTHT hỏi trải nghiệm."},
        { text: "30. He _______ (not / do) his homework yet, so the teacher is angry.", options: ["didn't do", "hasn't done", "doesn't do"], correct: "hasn't done", explain: "yet + kết quả hiện tại → HTHT phủ định."}
    ];

    // ---------- DATA TAB2: 30 câu viết lại câu HTHT <-> QKĐ ----------
    const rewriteQuestions = [
        { text: "1. The last time I saw her was two years ago.", correct: "I haven't seen her for two years.", explain: "The last time + QKĐ → haven't + V3/ed + for time."},
        { text: "2. She has never visited Ha Long Bay before.", correct: "This is the first time she has visited Ha Long Bay.", explain: "never ... before ↔ This is the first time + HTHT."},
        { text: "3. I started learning English 5 years ago.", correct: "I have learned English for 5 years.", explain: "started + ago → HTHT + for."},
        { text: "4. How long have you studied French?", correct: "When did you start studying French?", explain: "How long + HTHT ↔ When + did + start + V-ing."},
        { text: "5. We haven't met each other for a long time.", correct: "It's a long time since we last met each other.", explain: "haven't + for ↔ It's + time + since + S + last + V2."},
        { text: "6. He has worked for this company since 2015.", correct: "He started working for this company in 2015.", explain: "has worked since + mốc ↔ started + V-ing + in/ago."},
        { text: "7. I last played tennis in March.", correct: "I haven't played tennis since March.", explain: "last + V2 + in + mốc ↔ haven't + V3/ed + since."},
        { text: "8. They have never eaten sushi before.", correct: "This is the first time they have eaten sushi.", explain: "never ... before ↔ first time + HTHT."},
        { text: "9. When did she buy this dress?", correct: "How long has she had this dress?", explain: "When + did + buy ↔ How long + have + had (trạng thái)."},
        { text: "10. It's two years since I went to the cinema.", correct: "I haven't gone to the cinema for two years.", explain: "It's + time + since + QKĐ ↔ haven't + V3/ed + for time."},
        { text: "11. She began teaching at this school in 2010.", correct: "She has taught at this school since 2010.", explain: "began + in 2010 ↔ has + V3/ed + since."},
        { text: "12. I have never seen such a beautiful sunset.", correct: "This is the most beautiful sunset I have ever seen.", explain: "never seen such ... ↔ This is the most ... S + have ever seen."},
        { text: "13. The last time we had a barbecue was last summer.", correct: "We haven't had a barbecue since last summer.", explain: "last time + was + last summer ↔ haven't + V3/ed + since."},
        { text: "14. How long have you owned this laptop?", correct: "When did you buy this laptop?", explain: "How long have you owned ↔ When did you buy (động từ chuyển đổi)."},
        { text: "15. It's ages since I ate Korean food.", correct: "I haven't eaten Korean food for ages.", explain: "It's ages since ↔ haven't + V3/ed + for ages."},
        { text: "16. He moved to this city ten months ago.", correct: "He has lived in this city for ten months.", explain: "moved to + ago → has lived + for."},
        { text: "17. This is my first time flying on a plane.", correct: "I have never flown on a plane before.", explain: "first time + HTHT ↔ never + V3/ed + before."},
        { text: "18. I haven't talked to him since last Christmas.", correct: "The last time I talked to him was last Christmas.", explain: "haven't + since ↔ The last time + QKĐ + was + mốc."},
        { text: "19. She started playing the piano when she was 6.", correct: "She has played the piano since she was 6.", explain: "started + when she was 6 ↔ has + V3/ed + since."},
        { text: "20. They have been married for 15 years.", correct: "They got married 15 years ago.", explain: "have been married for 15 years ↔ got married + 15 years ago."},
        { text: "21. When did your father give up smoking?", correct: "How long has your father given up smoking?", explain: "When did + give up ↔ How long has + given up (hành động bắt đầu)."},
        { text: "22. We haven't watched that film yet.", correct: "We haven't watched that film up to now.", explain: "yet ↔ up to now (đồng nghĩa). (Đáp án mang tính minh họa: giữ nguyên cấu trúc phủ định HTHT)", correct: "We haven't watched that film up to now.", explain: "yet có thể thay bằng up to now / so far."},
        { text: "23. It's three months since I last saw my cousin.", correct: "I haven't seen my cousin for three months.", explain: "It's + time + since ↔ haven't + V3/ed + for time."},
        { text: "24. David last visited his grandparents on his birthday.", correct: "David hasn't visited his grandparents since his birthday.", explain: "last + V2 + on + mốc ↔ hasn't + V3/ed + since."},
        { text: "25. She has written three novels so far.", correct: "She wrote her first novel years ago. (tùy chỉnh) -> Đáp án mẫu: She started writing novels years ago.", explain: "So far HTHT có thể chuyển về QKĐ với thời gian bắt đầu", correct: "She started writing novels years ago.", explain: "has written so far ↔ started + V-ing + years ago."},
        { text: "26. I haven't felt this happy for a long time.", correct: "It's a long time since I felt this happy.", explain: "haven't + for + time ↔ It's + time + since + QKĐ."},
        { text: "27. How long is it since you left school?", correct: "When did you leave school?", explain: "How long is it since + QKĐ ↔ When + did + V?"},
        { text: "28. The last time it snowed was in January.", correct: "It hasn't snowed since January.", explain: "last time was + in January ↔ hasn't + V3/ed + since."},
        { text: "29. We began to learn English four years ago.", correct: "We have learned English for four years.", explain: "began + ago ↔ have + V3/ed + for."},
        { text: "30. She hasn't replied to my email yet.", correct: "She still hasn't replied to my email.", explain: "hasn't ... yet ↔ still hasn't + V3/ed (cấu trúc đồng nghĩa)", correct: "She still hasn't replied to my email.", explain: "yet có thể thay bằng still + phủ định."}
    ];

    // Render Tab 1
    function renderTab1() {
        const container = document.getElementById('formTab1');
        if (!container) return;
        let html = '';
        questionsTab1.forEach((q, idx) => {
            html += `<div class="question" data-correct="${q.correct}" data-idx="${idx}">
                        <p class="question-text">${q.text}</p>
                        <div class="options-grid">`;
            q.options.forEach(opt => {
                html += `<label class="opt-label">
                            <input type="radio" name="q1_${idx}" value="${opt}">
                            <span>${opt}</span>
                         </label>`;
            });
            html += `</div><div class="explanation">${q.explain}</div></div>`;
        });
        container.innerHTML = html;
    }

    // Render Tab 2 (Rewrite)
    function renderTab2() {
        const container = document.getElementById('formTab2');
        if (!container) return;
        let html = '';
        rewriteQuestions.forEach((item, idx) => {
            html += `<div class="question" data-correct="${item.correct}" data-idx="${idx}">
                        <p class="question-text">✍️ ${item.text}</p>
                        <div class="options-grid" style="grid-template-columns:1fr;">
                            <label class="opt-label" style="border-radius:60px;">
                                <input type="text" name="rewrite_${idx}" placeholder="Nhập câu viết lại của bạn..." style="flex:1; padding:10px; border-radius:40px; border:1px solid #ccc; outline:none;">
                            </label>
                        </div>
                        <div class="explanation" style="background:#eaf7ea;">📘 Gợi ý: ${item.explain}<br><strong>✅ Đáp án tham khảo: ${item.correct}</strong></div>
                    </div>`;
        });
        container.innerHTML = html;
    }

    // Kiểm tra Tab1 (30 câu trắc nghiệm)
    function checkTab1() {
        const questions = document.querySelectorAll('#formTab1 .question');
        let score = 0;
        questions.forEach((q, idx) => {
            const correctAns = q.getAttribute('data-correct');
            const selectedRadio = q.querySelector(`input[type="radio"]:checked`);
            const explanationDiv = q.querySelector('.explanation');
            const labels = q.querySelectorAll('.opt-label');
            labels.forEach(l => l.classList.remove('correct', 'incorrect'));
            if (explanationDiv) explanationDiv.style.display = 'block';
            if (selectedRadio) {
                const userVal = selectedRadio.value;
                if (userVal === correctAns) {
                    score++;
                    selectedRadio.parentElement.classList.add('correct');
                } else {
                    selectedRadio.parentElement.classList.add('incorrect');
                    labels.forEach(label => {
                        if (label.querySelector('input').value === correctAns) {
                            label.classList.add('correct');
                        }
                    });
                }
            } else {
                labels.forEach(label => {
                    if (label.querySelector('input').value === correctAns) {
                        label.classList.add('correct');
                    }
                });
            }
        });
        const total = questions.length;
        const resultDiv = document.getElementById('resultTab1');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `📊 Tab 1: Bạn đúng ${score}/${total} câu. ${score === total ? '🎉 Xuất sắc! Nắm chắc phân biệt thì.' : '💪 Xem giải thích bên dưới mỗi câu để cải thiện!'}`;
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // Kiểm tra Tab2 (Rewrite – so sánh không phân biệt hoa/thường và khoảng trắng)
    function checkTab2() {
        const questions = document.querySelectorAll('#formTab2 .question');
        let score = 0;
        questions.forEach((q, idx) => {
            const correctAnswerRaw = q.getAttribute('data-correct');
            const inputField = q.querySelector('input[type="text"]');
            const explanationDiv = q.querySelector('.explanation');
            if (explanationDiv) explanationDiv.style.display = 'block';
            if (inputField && inputField.value.trim() !== "") {
                const userAnswer = inputField.value.trim().toLowerCase().replace(/\s+/g, ' ');
                const correctNorm = correctAnswerRaw.toLowerCase().replace(/\s+/g, ' ');
                if (userAnswer === correctNorm) {
                    score++;
                    inputField.style.border = "2px solid #2ecc71";
                    inputField.style.background = "#e6ffed";
                } else {
                    inputField.style.border = "2px solid #e74c3c";
                    inputField.style.background = "#ffe6e6";
                }
            } else {
                if (inputField) inputField.style.border = "2px solid #f39c12";
            }
        });
        const total = questions.length;
        const resDiv = document.getElementById('resultTab2');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `✍️ Tab 2: Bạn viết đúng ${score}/${total} câu (so khớp đáp án tham khảo). Hãy xem phần giải thích bên dưới mỗi câu để học công thức.`;
        resDiv.scrollIntoView({ behavior: 'smooth' });
    }

    function switchTab(tabId) {
        const tab1 = document.getElementById('tab1');
        const tab2 = document.getElementById('tab2');
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        if (tabId === 'tab1') {
            tab1.classList.add('active');
            tab2.classList.remove('active');
            btns[0].classList.add('active');
        } else {
            tab2.classList.add('active');
            tab1.classList.remove('active');
            btns[1].classList.add('active');
        }
    }

    renderTab1();
    renderTab2();
</script>
</body>
</html>
